<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Agradecimento da landing page (/landing-page). O endereço tem "/obrigado"
     de propósito: o GTM dispara as duas conversões do Google Ads em qualquer
     página cujo endereço contenha "/obrigado". Aqui o GTM só é carregado quando
     existe um pedido de verdade na sessão, então visita direta não conta. -->
<title>Pedido enviado | Elisângela Selau Arquitetura</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F4F0E9">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/mulish.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
<style>
  .ty{min-height:100svh; display:grid; place-items:center; text-align:center; padding:2rem var(--gutter)}
  .ty__inner{max-width:44ch}
  .ty .brand{width:clamp(190px,26vw,250px); color:var(--ink); margin:0 auto 2.75rem}
  .ty h1{font-family:var(--serif); font-weight:200; font-size:clamp(2.1rem,5vw,3.4rem); line-height:1.06; letter-spacing:-.025em; margin-bottom:1.1rem}
  .ty p{color:var(--ink-2); margin-bottom:2.25rem}
  .ty__acoes{display:flex; flex-wrap:wrap; gap:.9rem; justify-content:center}
  .dots{display:flex; gap:7px; justify-content:center; margin-bottom:2.5rem}
  .dots i{width:6px; height:6px; border-radius:50%; background:var(--bronze); opacity:.28; animation:pulsa 1.25s infinite}
  .dots i:nth-child(2){animation-delay:.16s} .dots i:nth-child(3){animation-delay:.32s}
  @keyframes pulsa{0%,100%{opacity:.22; transform:scale(.85)} 45%{opacity:1; transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){ .dots i{animation:none; opacity:.6} }
</style>
</head>
<body>
<main class="ty">
  <div class="ty__inner">
    <a class="brand" href="landing-page" aria-label="Elisângela Selau Arquitetura"></a>
    <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 id="titulo">Pedido enviado.</h1>
    <p id="txt">Estamos abrindo o seu WhatsApp com a mensagem já preenchida. É só tocar em enviar.</p>
    <div class="ty__acoes">
      <a class="btn" id="ir" href="landing-page#formulario">
        <span id="ir-txt">Abrir o WhatsApp agora</span>
        <svg class="arw" width="15" height="9" viewBox="0 0 15 9" fill="none" aria-hidden="true"><path d="M0 4.5h13M9.5 1 13 4.5 9.5 8" stroke="currentColor" stroke-width="1.2"/></svg>
      </a>
      <a class="btn btn--ghost" id="voltar" href="landing-page">Voltar ao site</a>
    </div>
  </div>
</main>

<script>
(() => {
  const WHATS = '5554984026936';
  const GTM = 'GTM-5HN8STRT';
  const $ = (id) => document.getElementById(id);
  const ctx = (new URLSearchParams(location.search).get('c') || 'formulario').replace(/[^a-z0-9_-]/gi, '').slice(0, 24);

  // o pedido chega pela sessão (nunca pela URL); window.name é a reserva
  let msg = '', lead = {};
  try {
    msg = sessionStorage.getItem('elis_lp_msg') || '';
    lead = JSON.parse(sessionStorage.getItem('elis_lp_lead') || '{}');
    sessionStorage.removeItem('elis_lp_msg');
    sessionStorage.removeItem('elis_lp_lead');
  } catch (_) {}
  if (window.name.indexOf('elis_lp:') === 0) {
    if (!msg) {
      try { const p = JSON.parse(window.name.slice(8)); msg = p.msg || ''; lead = p.lead || {}; } catch (_) {}
    }
    window.name = '';
  }

  if (!msg) {
    // Sem formulário preenchido: nada de WhatsApp e nada de conversão.
    $('dots').remove();
    $('titulo').textContent = 'Falta preencher o formulário.';
    $('txt').textContent = 'Para falar com o escritório, preencha o formulário da página. Leva menos de um minuto.';
    $('ir-txt').textContent = 'Ir para o formulário';
    $('voltar').remove();
    return;
  }

  const destino = `https://wa.me/${WHATS}?text=${encodeURIComponent(msg)}`;
  $('ir').href = destino;

  // Redireciona quando as tags do GTM terminarem (eventCallback), com 0,9s de
  // tela mínima para a página não só piscar e teto de 2,6s para quando um
  // bloqueador impede o GTM e o callback nunca vem.
  const reduzir = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const inicio = Date.now();
  let prontas = false, partiu = false;
  const vai = () => { if (partiu || reduzir) return; partiu = true; location.replace(destino); };
  const tenta = () => { if (prontas && Date.now() - inicio >= 900) vai(); };

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({
    'gtm.start': new Date().getTime(), event: 'gtm.js',
    eventCallback: () => { prontas = true; tenta(); }, eventTimeout: 2000
  });
  window.dataLayer.push({ event: 'conversao_orcamento', contexto: ctx, pagina: 'landing-page', ...lead });
  const s = document.createElement('script');
  s.async = true;
  s.src = `https://www.googletagmanager.com/gtm.js?id=${GTM}`;
  document.head.appendChild(s);

  if (reduzir) {
    $('txt').textContent = 'Recebemos o seu pedido. Toque no botão abaixo para abrir o WhatsApp com a mensagem pronta.';
  } else {
    setTimeout(tenta, 900);
    setTimeout(vai, 2600);
  }
})();
</script>
</body>
</html>
